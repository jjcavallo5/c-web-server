<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jeremy Cavallo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main>
      <h1><i>Jeremy Cavallo</i></h1>
      <button onclick="hitEndpoint()">Hit Endpoint</button>
      <div id="response-container"></div>
    </main>
  </body>

  <footer>
    <script>
      const hitEndpoint = async () => {
        const resp = await fetch("/endpoint");
        const body = await resp.text();

        if (!resp.ok) throw Error(body);

        document
          .getElementById("response-container")
          .setHTMLUnsafe(`<p>${body}</p>`);
      };
    </script>
  </footer>
</html>
